<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pyroquad on wasm</title>
<style>
  html, body { margin: 0; height: 100%; background: #101014; color: #cfd2d8;
               font: 13px/1.5 ui-monospace, Consolas, monospace; overflow: hidden; }
  #glcanvas  { display: block; width: 100vw; height: 100vh; outline: none; }
  #log       { position: fixed; inset: 0 auto auto 0; margin: 10px; padding: 8px 10px;
               max-width: min(560px, calc(100vw - 40px)); max-height: calc(100vh - 40px);
               overflow: auto; white-space: pre-wrap; background: rgba(8,8,12,.78);
               border: 1px solid #2a2d35; border-radius: 6px; pointer-events: auto;
               cursor: pointer; }
  /* Once a script is actually running, the page belongs to it - the log
     collapses to a corner badge and expands again on click. */
  #log.collapsed { max-height: 1.6em; overflow: hidden; opacity: .35; }
  #log.collapsed > :not(:last-child) { display: none; }
  .err { color: #ff8a80; }
  .ok  { color: #9ae6a0; }
  .dim { color: #7f8694; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="0"></canvas>
<pre id="log"></pre>

<script src="./pyodide/pyodide.js"></script>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("glcanvas");
  const logEl = document.getElementById("log");
  logEl.addEventListener("click", () => logEl.classList.toggle("collapsed"));
  const log = (msg, cls) => {
    const line = document.createElement("span");
    if (cls) line.className = cls;
    line.textContent = msg + "\n";
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  };

  // The page runs ./game.py. ?script=other.py picks a different file, resolved
  // against this directory (so ?script=../test.py reaches the repo root), and an
  // empty ?script= drops back to the import smoke test.
  const params = new URLSearchParams(location.search);
  const script = params.has("script") ? params.get("script") : "game.py";

  const SMOKE = `
import sys, pyroquad
from pyroquad import *
print("python  ", sys.version.split()[0])
print("platform", sys.platform)
print("package ", pyroquad.__file__)
names = [n for n in dir(pyroquad) if not n.startswith("_")]
print("exports ", len(names))
print("sample  ", ", ".join(sorted(names)[:14]))
print("Color.RED", Color.RED)
print("Vec2      ", Vec2(3, 4).length())
`;

  (async () => {
    // The engine yields a frame by suspending the wasm stack, so a script needs
    // JSPI - without it the game would simply hang, which is worth saying out loud.
    if (script && typeof WebAssembly.Suspending === "undefined") {
      log("This browser does not support JSPI (WebAssembly stack switching).", "err");
      log("pyroquad needs it to yield a frame, so the game cannot run here.", "err");
      log("Chrome or Edge 137+ works; Firefox and Safari do not yet.", "dim");
      return;
    }

    log("loading pyodide ...", "dim");
    const pyodide = await loadPyodide({
      indexURL: "./pyodide/",
      stdout: (s) => log(s),
      stderr: (s) => log(s, "err"),
    });
    window.pyodide = pyodide;
    log("pyodide " + pyodide.version + "  (CPython " + pyodide.runPython("import sys; sys.version.split()[0]") + ")", "ok");
    log("JSPI available: " + (typeof WebAssembly.Suspending !== "undefined"), "dim");

    // The engine is published to PyPI as a pyemscripten wasm32 wheel, so the
    // page installs it with micropip exactly the way a user would - no engine
    // build is vendored here, and a reload picks up the latest release.
    // ?pyroquad=0.1.6 pins a version (only releases that ship a wasm32 wheel
    // can run here), and ?pyroquad=<url to a .whl> installs that file instead,
    // which is how a locally built wheel gets tried before it is published.
    const pin = params.get("pyroquad");
    const requirement = !pin ? "pyroquad" : /^[0-9]/.test(pin) ? "pyroquad==" + pin : pin;

    log("installing " + requirement + " from PyPI ...", "dim");
    // micropip ships next to the runtime (demo/get_pyodide.py stages it), so
    // this resolves locally rather than against a package CDN.
    await pyodide.loadPackage("micropip");
    const micropip = pyodide.pyimport("micropip");
    await micropip.install(requirement);
    log("installed pyroquad " + pyodide.runPython(
      "import importlib.metadata as m; m.version('pyroquad')"), "ok");

    if (script) {
      log("fetching " + script, "dim");
      const res = await fetch(script, { cache: "no-store" });
      if (!res.ok) throw new Error("could not fetch " + script + " (HTTP " + res.status + ")");
      const src = await res.text();
      log("running " + script + " ...", "dim");
      // Keyboard events go to the focused element, and nothing focuses the
      // canvas on its own - without this, WASD does nothing until it is clicked.
      canvas.focus();
      setTimeout(() => logEl.classList.add("collapsed"), 1500);
      await pyodide.runPythonAsync(src);
      logEl.classList.remove("collapsed");
      log("finished " + script, "ok");
    } else {
      log("import smoke test ...", "dim");
      await pyodide.runPythonAsync(SMOKE);
      log("import OK", "ok");
    }
  })().catch((e) => {
    log("FAILED: " + (e && e.message ? e.message : e), "err");
    if (e && e.stack) log(e.stack, "dim");
  });
})();
</script>
</body>
</html>
